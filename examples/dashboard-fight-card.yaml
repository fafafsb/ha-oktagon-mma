# OKTAGON MMA – compact expandable fight card (v0.3.2+)
# Requires HACS Frontend: button-card
# Dashboard > Edit > Add card > Manual > paste this YAML.
# Change entity if your fight-card entity ID differs.
type: custom:button-card
entity: sensor.next_oktagon_fight_card
show_icon: false
show_name: false
show_state: false
tap_action:
  action: none
triggers_update:
  - sensor.next_oktagon_fight_card
styles:
  card:
    - background: "linear-gradient(145deg,#1b1b1b,#090909)"
    - color: white
    - border: "1px solid #48402a"
    - border-radius: 20px
    - padding: 18px
    - box-shadow: "0 10px 28px rgba(0,0,0,.25)"
  grid:
    - grid-template-areas: '"content"'
    - grid-template-columns: 100%
  custom_fields:
    content:
      - width: 100%
      - min-width: 0
custom_fields:
  content: |
    [[[
      const attrs = entity?.attributes ?? {};
      const fights = Array.isArray(attrs.fights) ? attrs.fights : [];
      const esc = value => String(value ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
      const eventName = attrs.event || 'Nächstes OKTAGON Event';
      const eventUrl = typeof attrs.event_url === 'string' && /^https:\/\/oktagonmma\.com\//.test(attrs.event_url) ? attrs.event_url : '';
      const header = '<div style="text-align:left;margin-bottom:17px"><div style="font-size:11px;font-weight:800;letter-spacing:2px;color:#ffce22">OKTAGON MMA · FIGHT CARD</div><div style="font-size:22px;font-weight:900;line-height:1.2;margin-top:7px;white-space:normal;overflow-wrap:anywhere">' + esc(eventName) + '</div><div style="font-size:12px;color:#aaa;margin-top:6px">' + fights.length + ' Kämpfe</div></div>';
      if (!fights.length) return header + '<div style="text-align:left;color:#aaa;padding:18px 0;border-top:1px solid #333">Noch keine Fight Card verfügbar.</div>';
      const cards = fights.map((fight, index) => {
        const main = fight.main_event === true;
        const one = esc(fight.fighter_one || 'TBA');
        const two = esc(fight.fighter_two || 'TBA');
        const weight = esc(fight.weight_class || 'Gewichtsklasse offen');
        const title = main ? '★ MAIN EVENT' : 'KAMPF ' + (index + 1);
        const safeImage = url => typeof url === 'string' && /^https:\/\/assets\.oktagonmma\.com\//.test(url) ? url : '';
        const imgOne = safeImage(fight.fighter_one_image);
        const imgTwo = safeImage(fight.fighter_two_image);
        const portrait = (url, side) => url ? '<img loading="lazy" src="' + esc(url) + '" alt="" style="width:100%;height:' + (main ? '175' : '68') + 'px;object-fit:contain;object-position:center bottom;display:block">' : '<div style="height:' + (main ? '175' : '68') + 'px;display:grid;place-items:center;color:#777;font-size:24px">🥊</div>';
        if (main) return '<div style="border:2px solid #c59a12;background:linear-gradient(145deg,#302711,#111);border-radius:18px;padding:16px 12px;text-align:center">' +
          '<div style="font-size:11px;color:#ffce22;font-weight:900;letter-spacing:2px;margin-bottom:6px">★ MAIN EVENT ★</div>' +
          '<div style="font-size:11px;color:#bbb;margin-bottom:12px">' + weight + '</div>' +
          '<div style="display:grid;grid-template-columns:minmax(0,1fr) 42px minmax(0,1fr);align-items:end;gap:5px">' +
          '<div style="min-width:0">' + portrait(imgOne,'left') + '<div style="font-size:17px;font-weight:900;overflow-wrap:anywhere;margin-top:9px">' + one + '</div></div>' +
          '<div style="align-self:center;color:#ffce22;font-size:22px;font-weight:1000">VS</div>' +
          '<div style="min-width:0">' + portrait(imgTwo,'right') + '<div style="font-size:17px;font-weight:900;overflow-wrap:anywhere;margin-top:9px">' + two + '</div></div></div></div>';
        return '<div style="border:1px solid ' + (main ? '#b48b12' : '#343434') + ';background:' + (main ? 'linear-gradient(135deg,#2b2617,#141414)' : '#171717') + ';border-radius:14px;padding:13px 12px;text-align:left;min-width:0">' +
          '<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px;font-size:10px;font-weight:800;letter-spacing:1px"><span style="color:#ffce22">' + title + '</span><span style="color:#bbb;overflow-wrap:anywhere">' + weight + '</span></div>' +
          '<div style="display:grid;grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr);align-items:center;gap:7px">' +
          '<div style="min-width:0">' + portrait(imgOne,'left') + '<div style="font-size:14px;font-weight:800;line-height:1.25;overflow-wrap:anywhere">' + one + '</div></div>' +
          '<div style="text-align:center;color:#ffce22;font-size:13px;font-weight:900">VS</div>' +
          '<div style="min-width:0;text-align:right">' + portrait(imgTwo,'right') + '<div style="font-size:14px;font-weight:800;line-height:1.25;overflow-wrap:anywhere">' + two + '</div></div></div></div>';
      });
      const mainIndex = fights.findIndex(fight => fight.main_event === true);
      const featuredIndex = mainIndex >= 0 ? mainIndex : 0;
      const featured = cards[featuredIndex];
      const others = cards.filter((_, index) => index !== featuredIndex);
      const more = others.length ? '<details style="margin-top:12px;text-align:left">' +
        '<summary style="cursor:pointer;list-style:revert;background:#242424;border:1px solid #504321;border-radius:12px;padding:14px;color:#ffce22;font-size:13px;font-weight:800;text-align:center">' +
        'Weitere ' + others.length + ' Kämpfe anzeigen / ausblenden ▾</summary>' +
        '<div style="display:grid;gap:9px;margin-top:10px">' + others.join('') + '</div></details>' : '';
      return header + featured + more +
        (eventUrl ? '<div style="font-size:11px;color:#aaa;text-align:left;margin-top:14px">Quelle: ' + esc(eventUrl) + '</div>' : '');
    ]]]
